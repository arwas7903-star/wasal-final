<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — وصالنا</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="disabilities">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>
  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>
  <script>
    window.addEventListener("layout-ready", async function () {
      const root = document.getElementById("page-root");
      const list = await API.getDisabilities();
      const lang = localStorage.getItem(Config.KEYS.LANG) || "ar";
      const names = list.map(d => lang === "ar" ? d.nameAr : d.nameEn).join("، ");
      speak(`${T("disability.title")}. ${names}`);

      root.innerHTML = `
        <button class="back-btn" onclick="history.back()">← ${T("common.back")}</button>
        <div class="page-header">
          <h1>${T("disability.title")}</h1>
          <p>${T("disability.subtitle")}</p>
        </div>
        <div class="grid-3 fade-in">
          ${list.map(d => {
            const name = lang === "ar" ? d.nameAr : d.nameEn;
            const desc = lang === "ar" ? d.descriptionAr : d.descriptionEn;
            return `
              <a href="./disability-detail.html?id=${d.id}" class="card-link">
                <div class="card hover" style="height:100%">
                  <h2 class="text-xl font-bold" style="color:var(--primary);margin-bottom:10px">${name}</h2>
                  <p class="text-muted">${desc}</p>
                </div>
              </a>`;
          }).join("")}
        </div>`;
    });
  </script>
</body>
</html>
