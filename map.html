<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — تفاصيل الحجز</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="services" data-require-auth="true">
  <div id="layout-header"></div>
  <main class="main-content">
    <div id="page-root"></div>
  </main>
  <div id="layout-bottom-nav"></div>
  <div id="toast-container"></div>
  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>
  <script>
    let selectedPay = null;
    let selectedService = null;
    let selectedOption = null;
    function showToast(msg, isError) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " error" : "");
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }
    function selectPay(method) {
      selectedPay = method;
      document.querySelectorAll(".pay-method").forEach(el => {
        el.classList.remove("selected");
      });
      const btn = document.getElementById("pay-" + method);
      if (btn) btn.classList.add("selected");
      const cardFields = document.getElementById("card-fields");
      if (cardFields) {
        cardFields.style.display = method === "card" ? "block" : "none";
      }
    }
    function formatCard(value) {
      return value
        .replace(/\D/g, "")
        .slice(0, 16)
        .replace(/(.{4})/g, "$1 ")
        .trim();
    }
    function formatExpiry(value) {
      const v = value.replace(/\D/g, "").slice(0, 4);
      return v.length >= 3 ? v.slice(0, 2) + "/" + v.slice(2) : v;
    }
    function renderFields(option) {
      return (option.fields || []).map((field) => {
        const isTime = field === "الوقت";
        const isTextarea = field.includes("تفاصيل") || field.includes("شرح");
        if (isTextarea) {
          return `
            <div class="form-group">
              <label>${field} <span class="required">*</span></label>
              <textarea class="input booking-field" data-label="${field}" placeholder="اكتب ${field}" required></textarea>
            </div>
          `;
        }
        return `
          <div class="form-group">
            <label>${field} <span class="required">*</span></label>
            <input class="input booking-field" data-label="${field}" type="${isTime ? "time" : "text"}" placeholder="أدخل ${field}" required>
          </div>
        `;
      }).join("");
    }
    function renderMapButton(option) {
      const fieldsText = (option.fields || []).join(" ");
      const needsMap =
        fieldsText.includes("موقع") ||
        fieldsText.includes("الموقع") ||
        fieldsText.includes("وجهة") ||
        fieldsText.includes("الوجهة") ||
        fieldsText.includes("المنزل");
      if (!needsMap) return "";
      return `
        <div class="form-group">
          <a href="./map.html" class="btn btn-outline btn-full">
            🗺️ فتح الخريطة لتحديد الموقع
          </a>
        </div>
        <p class="text-muted text-sm" style="margin-bottom:15px">
          يمكنك تحديد البداية والوجهة من الخريطة، وسيتم حفظها داخل الطلب.
        </p>
      `;
    }
    function renderSavedMapInfo() {
      const startLocation = JSON.parse(localStorage.getItem("startLocation"));
      const destinationLocation = JSON.parse(localStorage.getItem("destinationLocation"));
      if (!startLocation && !destinationLocation) return "";
      return `
        <div class="card mb-4" style="background:#f8fafc">
          <h3 class="mb-2">المواقع المحفوظة من الخريطة</h3>
          ${
            startLocation
              ? `<p class="text-muted text-sm">نقطة البداية: ${startLocation.lat.toFixed(5)}, ${startLocation.lng.toFixed(5)}</p>`
              : ""
          }
          ${
            destinationLocation
              ? `<p class="text-muted text-sm">الوجهة: ${destinationLocation.lat.toFixed(5)}, ${destinationLocation.lng.toFixed(5)}</p>`
              : ""
          }
        </div>
      `;
    }
    function renderImage(option) {
      if (!option.imageOptional) return "";
      return `
        <div class="form-group">
          <label>رفع صورة للمشكلة <span class="optional">(اختياري)</span></label>
          <input id="problem-image" class="input" type="file" accept="image/*">
        </div>
      `;
    }
    async function loadBook() {
      const root = document.getElementById("page-root");
      const params = new URLSearchParams(location.search);
      const serviceId = Number(params.get("serviceId"));
      const optionId = Number(params.get("optionId"));
      const services = await API.getServices();
      selectedService = services.find(s => Number(s.id) === serviceId);
      if (!selectedService) {
        root.innerHTML = `
          <div class="empty-state">
            <h2>لم يتم العثور على الخدمة</h2>
            <a href="./services.html" class="btn btn-primary mt-4">العودة للخدمات</a>
          </div>
        `;
        return;
      }
      selectedOption = selectedService.options.find(o => Number(o.id) === optionId);
      if (!selectedOption) {
        root.innerHTML = `
          <div class="empty-state">
            <h2>لم يتم العثور على نوع الخدمة</h2>
            <a href="./service-detail.html?id=${serviceId}" class="btn btn-primary mt-4">العودة</a>
          </div>
        `;
        return;
      }
      root.innerHTML = `
        <div class="fade-in" style="max-width:650px;margin:0 auto">
          <button class="back-btn" onclick="history.back()">← رجوع</button>
          <h1 class="text-primary mb-4">تفاصيل الحجز</h1>
          <div class="card mb-4" style="background:var(--primary-bg);border-color:hsl(153 55% 78%)">
            <p class="text-xs text-muted mb-1">الخدمة المختارة</p>
            <h3>${selectedService.icon} ${selectedService.nameAr} — ${selectedOption.nameAr}</h3>
            <p class="text-muted mt-2">${selectedOption.descriptionAr}</p>
            <div class="flex justify-between items-center mt-3">
              <span class="text-muted text-sm">السعر</span>
              <span style="font-size:1.6rem;font-weight:800;color:var(--primary)">
                ${selectedOption.priceBase}
                <span class="text-muted" style="font-size:.9rem;font-weight:400">ر.س</span>
              </span>
            </div>
          </div>
          ${renderSavedMapInfo()}
          <form id="book-form" onsubmit="handleBook(event)">
            <div class="card mb-4">
              ${renderFields(selectedOption)}
              ${renderMapButton(selectedOption)}
              ${renderImage(selectedOption)}
              <div class="form-group">
                <label>ملاحظات إضافية <span class="optional">(اختياري)</span></label>
                <textarea id="notes" class="input" placeholder="اكتبي أي تفاصيل إضافية"></textarea>
              </div>
            </div>
            <div class="card mb-4">
              <h3 class="mb-3">طريقة الدفع</h3>
              <div class="pay-methods">
                <button type="button" id="pay-card" class="pay-method" onclick="selectPay('card')">💳 بطاقة بنكية</button>
                <button type="button" id="pay-applepay" class="pay-method pay-method-apple" onclick="selectPay('applepay')"> Pay</button>
              </div>
              <div id="card-fields" class="card-fields space-y-4" style="display:none">
                <div class="form-group">
                  <label>رقم البطاقة <span class="required">*</span></label>
                  <input id="card-num" class="input" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19" oninput="this.value=formatCard(this.value)">
                </div>
                <div class="form-grid-2">
                  <div class="form-group">
                    <label>تاريخ الانتهاء <span class="required">*</span></label>
                    <input id="card-exp" class="input" inputmode="numeric" placeholder="MM/YY" maxlength="5" oninput="this.value=formatExpiry(this.value)">
                  </div>
                  <div class="form-group">
                    <label>CVV <span class="required">*</span></label>
                    <input id="card-cvv" class="input" inputmode="numeric" placeholder="000" maxlength="3" oninput="this.value=this.value.replace(/\\D/g,'')">
                  </div>
                </div>
                <div class="form-group">
                  <label>الاسم على البطاقة <span class="required">*</span></label>
                  <input id="card-name" class="input" type="text" placeholder="كما يظهر على البطاقة">
                </div>
              </div>
            </div>
            <button type="submit" id="pay-btn" class="btn btn-primary btn-full btn-lg">
              تأكيد ودفع — ${selectedOption.priceBase} ر.س
            </button>
          </form>
        </div>
      `;
    }
    async function handleBook(e) {
      e.preventDefault();
      if (!selectedPay) {
        showToast("يرجى اختيار طريقة الدفع", true);
        return;
      }
      const fields = Array.from(document.querySelectorAll(".booking-field"));
      const fieldDetails = fields.map(input => `${input.dataset.label}: ${input.value.trim()}`);
      const firstValue = fields[0]?.value.trim() || "";
      const secondValue = fields[1]?.value.trim() || "";
      const timeField = fields.find(input => input.dataset.label === "الوقت");
      const timeValue = timeField ? timeField.value : "";
      const notes = document.getElementById("notes").value.trim();
      const startLocation = JSON.parse(localStorage.getItem("startLocation"));
      const destinationLocation = JSON.parse(localStorage.getItem("destinationLocation"));
      const mapDetails = [
        startLocation
          ? `نقطة البداية من الخريطة: ${startLocation.lat}, ${startLocation.lng}`
          : "",
        destinationLocation
          ? `الوجهة من الخريطة: ${destinationLocation.lat}, ${destinationLocation.lng}`
          : ""
      ].filter(Boolean);
      let imageNote = "";
      const imageInput = document.getElementById("problem-image");
      if (imageInput && imageInput.files && imageInput.files.length > 0) {
        imageNote = `الصورة المرفقة: ${imageInput.files[0].name}`;
      }
      const fullNotes = [
        ...fieldDetails,
        ...mapDetails,
        imageNote,
        notes ? `ملاحظات إضافية: ${notes}` : ""
      ].filter(Boolean).join(" | ");
      try {
        const order = await API.createOrder({
          serviceOptionId: selectedOption.id,
          locationFrom: firstValue,
          locationTo: secondValue,
          scheduledDate: new Date().toISOString().slice(0, 10),
          scheduledTime: timeValue,
          notes: fullNotes,
          additionalFee: null
        });
        await API.confirmOrder(order.id);
        location.href = "./order-detail.html?id=" + order.id;
      } catch (err) {
        showToast("حدث خطأ أثناء تأكيد الحجز", true);
      }
    }
    window.addEventListener("DOMContentLoaded", loadBook);
  </script>
</body>
</html>
