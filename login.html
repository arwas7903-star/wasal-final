<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — تسجيل الدخول</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="login">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>
  <div id="toast-container"></div>

  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>

  <script>
    let isRegister = false;

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validatePassword(password) {
      return password.length >= 6;
    }

    function showToast(msg, isError) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " error" : "");
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function getAccounts() {
      return JSON.parse(localStorage.getItem("wasal_accounts") || "[]");
    }

    function saveAccounts(accounts) {
      localStorage.setItem("wasal_accounts", JSON.stringify(accounts));
    }

    function renderForm() {
      const r = isRegister;

      document.getElementById("page-root").innerHTML = `
        <div class="auth-wrap fade-in">
          <button class="back-btn" onclick="history.back()">← ${T("common.back")}</button>

          <div class="card auth-card">
            <h1 class="text-2xl font-bold text-center" style="color:var(--primary)">
              ${r ? "إنشاء حساب جديد" : "تسجيل الدخول"}
            </h1>

            <p class="text-center text-muted mt-2">
              ${r ? "أنشئ حسابك أولاً للوصول إلى خدمات وصال" : "سجل دخولك بالحساب الذي أنشأته سابقًا"}
            </p>

            <form id="auth-form" class="space-y-4 mt-6" onsubmit="handleSubmit(event)">
              ${r ? `
                <div class="form-group">
                  <label for="inp-name">الاسم الكامل</label>
                  <input id="inp-name" class="input" type="text" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="form-group">
                  <label for="inp-phone">رقم الجوال</label>
                  <input id="inp-phone" class="input" type="tel" placeholder="05xxxxxxxx" required>
                </div>
              ` : ""}

              <div class="form-group">
                <label for="inp-email">البريد الإلكتروني</label>
                <input id="inp-email" class="input" type="email" placeholder="example@gmail.com" required>
              </div>

              <div class="form-group">
                <label for="inp-password">كلمة المرور</label>
                <input id="inp-password" class="input" type="password" placeholder="6 أحرف على الأقل" required>
              </div>

              <button type="submit" id="submit-btn" class="btn btn-primary btn-full mt-2">
                ${r ? "إنشاء حساب" : "تسجيل الدخول"}
              </button>

              <p class="text-center text-sm text-muted mt-2">
                ${r ? "لديك حساب بالفعل؟" : "ليس لديك حساب؟"}
                <a href="#" onclick="toggleMode(); return false;" style="color:var(--primary);font-weight:600;">
                  ${r ? "سجل دخولك" : "أنشئ حساباً"}
                </a>
              </p>
            </form>
          </div>
        </div>`;
    }

    function toggleMode() {
      isRegister = !isRegister;
      renderForm();
    }

    function handleSubmit(e) {
      e.preventDefault();

      const email = document.getElementById("inp-email").value.trim().toLowerCase();
      const password = document.getElementById("inp-password").value;

      if (!validateEmail(email)) {
        showToast("يرجى إدخال بريد إلكتروني صحيح", true);
        return;
      }

      if (!validatePassword(password)) {
        showToast("كلمة المرور يجب أن تكون 6 أحرف على الأقل", true);
        return;
      }

      const accounts = getAccounts();

      if (isRegister) {
        const name = document.getElementById("inp-name").value.trim();
        const phone = document.getElementById("inp-phone").value.trim();

        const exists = accounts.find(acc => acc.email === email);

        if (exists) {
          showToast("هذا البريد مسجل مسبقًا، سجلي دخولك", true);
          return;
        }

        const newUser = {
          id: Date.now(),
          name,
          phone,
          email,
          password
        };

        accounts.push(newUser);
        saveAccounts(accounts);

        showToast("تم إنشاء الحساب بنجاح، سجلي دخولك الآن");
        isRegister = false;
        renderForm();
        return;
      }

      const user = accounts.find(acc => acc.email === email && acc.password === password);

      if (!user) {
        showToast("الإيميل أو كلمة المرور غير صحيحة، أو لا يوجد حساب بهذا البريد", true);
        return;
      }

      localStorage.setItem(Config.KEYS.TOKEN, "demo-token");
      localStorage.setItem("wasal_user", JSON.stringify({
        id: user.id,
        name: user.name,
        email: user.email,
        phone: user.phone
      }));

      showToast("تم تسجيل الدخول بنجاح");
      location.href = "./disabilities.html";
    }

    window.addEventListener("layout-ready", renderForm);
  </script>
</body>
</html>
