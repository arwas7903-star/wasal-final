<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — تسجيل الدخول</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="login">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>
  <div id="toast-container"></div>
  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>
  <script>
    let isRegister = false;

    function validateEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
    function validatePassword(p) { return p.length >= 6; }

    function showToast(msg, isError) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " error" : "");
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function renderForm() {
      const r = isRegister;
      document.getElementById("page-root").innerHTML = `
        <div class="auth-wrap fade-in">
          <button class="back-btn" onclick="history.back()">← ${T("common.back")}</button>
          <div class="card auth-card">
            <h1 class="text-2xl font-bold text-center" style="color:var(--primary)">${r ? T("auth.register_title") : T("auth.login_title")}</h1>
            <p class="text-center text-muted mt-2">${r ? T("auth.register_subtitle") : T("auth.login_subtitle")}</p>

            <form id="auth-form" class="space-y-4 mt-6" onsubmit="handleSubmit(event)">
              ${r ? `
              <div class="form-group">
                <label for="inp-name">${T("auth.name")}</label>
                <input id="inp-name" class="input" type="text" placeholder="${T("auth.name_hint")}" required>
              </div>
              <div class="form-group">
                <label for="inp-phone">${T("auth.phone")}</label>
                <input id="inp-phone" class="input" type="tel" placeholder="${T("auth.phone_hint")}" required>
              </div>` : ""}

              <div class="form-group">
                <label for="inp-email">${T("auth.email")}</label>
                <input id="inp-email" class="input" type="email" placeholder="${T("auth.email_hint")}" required>
                <span class="field-hint" id="email-hint">${T("auth.email_hint")}</span>
              </div>
              <div class="form-group">
                <label for="inp-password">${T("auth.password")}</label>
                <input id="inp-password" class="input" type="password" required>
                <span class="field-hint" id="pw-hint">${T("auth.password_hint")}</span>
              </div>

              <button type="submit" id="submit-btn" class="btn btn-primary btn-full mt-2">
                ${r ? T("auth.register_btn") : T("auth.login_btn")}
              </button>

              <p class="text-center text-sm text-muted mt-2">
                ${r ? T("auth.have_account") : T("auth.no_account")}
                <a href="#" onclick="toggleMode(); return false;" style="color:var(--primary);font-weight:600;">
                  ${r ? T("auth.login_instead") : T("auth.create_one")}
                </a>
              </p>
            </form>
          </div>
        </div>`;
    }

    function toggleMode() { isRegister = !isRegister; renderForm(); }

    async function handleSubmit(e) {
      e.preventDefault();
      const email    = document.getElementById("inp-email").value.trim();
      const password = document.getElementById("inp-password").value;
      if (!validateEmail(email) || !validatePassword(password)) return;

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = T("common.loading");

      try {
        let data;
        if (isRegister) {
          const name  = document.getElementById("inp-name").value.trim();
          const phone = document.getElementById("inp-phone").value.trim();
          data = await API.register({ email, password, name, phone });
        } else {
          data = await API.login({ email, password });
        }
        localStorage.setItem(Config.KEYS.TOKEN, data.token);
        showToast(isRegister ? T("auth.register_title") : T("auth.login_title"));
        location.href = "./disabilities.html";
      } catch (err) {
        showToast(err.message || T("common.error"), true);
        btn.disabled = false;
        btn.textContent = isRegister ? T("auth.register_btn") : T("auth.login_btn");
      }
    }

    window.addEventListener("layout-ready", renderForm);
  </script>
</body>
</html>
