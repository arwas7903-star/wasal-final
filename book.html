<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — تفاصيل الحجز</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body data-page="services" data-require-auth="true">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>
  <div id="toast-container"></div>

  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>

  <script>
    let selectedPay = null;
    let currentOption = null;
    let currentService = null;

    function showToast(msg, isError) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " error" : "");
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function selectPay(method) {
      selectedPay = method;

      document.querySelectorAll(".pay-method").forEach(el => {
        el.classList.remove("selected");
      });

      const selected = document.getElementById("pay-" + method);
      if (selected) selected.classList.add("selected");

      const cardFields = document.getElementById("card-fields");
      if (cardFields) {
        cardFields.style.display = method === "card" ? "block" : "none";
      }
    }

    function formatCard(v) {
      return v
        .replace(/\D/g, "")
        .slice(0, 16)
        .replace(/(.{4})/g, "$1 ")
        .trim();
    }

    function formatExpiry(v) {
      const d = v.replace(/\D/g, "").slice(0, 4);
      return d.length >= 3 ? d.slice(0, 2) + "/" + d.slice(2) : d;
    }

    function getFieldsForOption(option) {
      if (option.fields && option.fields.length) {
        return option.fields.filter(field => field !== "الوقت");
      }

      return ["تفاصيل الطلب"];
    }

    function renderDynamicFields(option) {
      const fields = getFieldsForOption(option);

      return fields.map((field, index) => {
        const isProblem = field.includes("وصف المشكلة") || field.includes("تفاصيل");

        if (isProblem) {
          return `
            <div class="form-group">
              <label>${field} <span class="required">*</span></label>
              <textarea 
                id="field-${index}" 
                class="input dynamic-field" 
                data-label="${field}" 
                placeholder="اكتب ${field}" 
                required></textarea>
            </div>
          `;
        }

        return `
          <div class="form-group">
            <label>${field} <span class="required">*</span></label>
            <input 
              id="field-${index}" 
              class="input dynamic-field" 
              data-label="${field}" 
              type="text" 
              placeholder="أدخل ${field}" 
              required>
          </div>
        `;
      }).join("");
    }

    window.addEventListener("layout-ready", async function () {
      const root = document.getElementById("page-root");
      const params = new URLSearchParams(location.search);

      const serviceId = Number(params.get("serviceId"));
      const optionId = Number(params.get("optionId"));

      if (!serviceId || !optionId) {
        root.innerHTML = `
          <div class="empty-state">
            <h2>لم يتم العثور على الخدمة</h2>
            <a href="./services.html">
              <button class="btn btn-primary mt-4">العودة للخدمات</button>
            </a>
          </div>
        `;
        return;
      }

      const service = await API.getService(serviceId);
      if (!service) {
        location.href = "./services.html";
        return;
      }

      const option = service.options.find(o => Number(o.id) === optionId);
      if (!option) {
        location.href = "./service-detail.html?id=" + serviceId;
        return;
      }

      currentService = service;
      currentOption = option;

      root.innerHTML = `
        <div class="fade-in" style="max-width:650px;margin:0 auto">
          <button class="back-btn" onclick="history.back()">← رجوع</button>

          <h1 class="text-primary mb-4">تفاصيل الحجز</h1>

          <div class="card mb-4" style="background:var(--primary-bg);border-color:hsl(153 55% 78%)">
            <p class="text-xs text-muted mb-1">الخدمة المختارة</p>
            <h3>${service.icon} ${service.nameAr} — ${option.nameAr}</h3>
            <p class="text-muted mt-2">${option.descriptionAr}</p>

            <div class="flex justify-between items-center mt-3">
              <span class="text-muted text-sm">السعر</span>
              <span style="font-size:1.6rem;font-weight:800;color:var(--primary)">
                ${option.priceBase} 
                <span class="text-muted" style="font-size:.9rem;font-weight:400">ر.س</span>
              </span>
            </div>
          </div>

          <form id="book-form" onsubmit="handleBook(event)">
            <div class="card mb-4">
              ${renderDynamicFields(option)}

              <div class="form-group">
                <label>التاريخ <span class="required">*</span></label>
                <input id="sched-date" class="input" type="date" required>
              </div>

              <div class="form-group">
                <label>الوقت <span class="required">*</span></label>
                <input id="sched-time" class="input" type="time" required>
              </div>

              ${
                option.imageOptional
                ? `
                  <div class="form-group">
                    <label>رفع صورة للمشكلة <span class="optional">(اختياري)</span></label>
                    <input id="problem-image" class="input" type="file" accept="image/*">
                  </div>
                `
                : ""
              }

              <div class="form-group">
                <label>ملاحظات إضافية <span class="optional">(اختياري)</span></label>
                <textarea id="notes" class="input" placeholder="اكتبي أي تفاصيل إضافية"></textarea>
              </div>
            </div>

            <div class="card mb-4">
              <h3 class="mb-3">طريقة الدفع</h3>

              <div class="pay-methods">
                <button type="button" id="pay-card" class="pay-method" onclick="selectPay('card')">
                  💳 بطاقة بنكية
                </button>

                <button type="button" id="pay-applepay" class="pay-method pay-method-apple" onclick="selectPay('applepay')">
                   Pay
                </button>
              </div>

              <div id="card-fields" class="card-fields space-y-4" style="display:none">
                <div class="form-group">
                  <label>رقم البطاقة <span class="required">*</span></label>
                  <input 
                    id="card-num" 
                    class="input" 
                    inputmode="numeric" 
                    placeholder="0000 0000 0000 0000" 
                    maxlength="19"
                    oninput="this.value=formatCard(this.value)">
                </div>

                <div class="form-grid-2">
                  <div class="form-group">
                    <label>تاريخ الانتهاء <span class="required">*</span></label>
                    <input 
                      id="card-exp" 
                      class="input" 
                      inputmode="numeric" 
                      placeholder="MM/YY" 
                      maxlength="5"
                      oninput="this.value=formatExpiry(this.value)">
                  </div>

                  <div class="form-group">
                    <label>CVV <span class="required">*</span></label>
                    <input 
                      id="card-cvv" 
                      class="input" 
                      inputmode="numeric" 
                      placeholder="000" 
                      maxlength="3"
                      oninput="this.value=this.value.replace(/\\D/g,'')">
                  </div>
                </div>

                <div class="form-group">
                  <label>الاسم على البطاقة <span class="required">*</span></label>
                  <input 
                    id="card-name" 
                    class="input" 
                    type="text" 
                    placeholder="كما يظهر على البطاقة">
                </div>
              </div>
            </div>

            <button type="submit" id="pay-btn" class="btn btn-primary btn-full btn-lg">
              تأكيد ودفع — ${option.priceBase} ر.س
            </button>
          </form>
        </div>
      `;
    });

    async function handleBook(e) {
      e.preventDefault();

      if (!selectedPay) {
        showToast("يرجى اختيار طريقة الدفع", true);
        return;
      }

      if (selectedPay === "card") {
        const num = (document.getElementById("card-num").value || "").replace(/\s/g, "");
        const exp = document.getElementById("card-exp").value || "";
        const cvv = document.getElementById("card-cvv").value || "";
        const name = document.getElementById("card-name").value || "";

        if (num.length < 16 || exp.length < 4 || cvv.length < 3 || !name.trim()) {
          showToast("يرجى إكمال بيانات البطاقة", true);
          return;
        }
      }

      const fields = Array.from(document.querySelectorAll(".dynamic-field"));

      const details = fields.map(field => {
        return `${field.dataset.label}: ${field.value.trim()}`;
      });

      const firstValue = fields[0] ? fields[0].value.trim() : "";
      const secondValue = fields[1] ? fields[1].value.trim() : "";

      const date = document.getElementById("sched-date").value;
      const time = document.getElementById("sched-time").value;
      const notes = document.getElementById("notes").value.trim();

      let imageText = "";
      const imageInput = document.getElementById("problem-image");
      if (imageInput && imageInput.files.length > 0) {
        imageText = `الصورة المرفقة: ${imageInput.files[0].name}`;
      }

      const fullNotes = [
        `تفاصيل الخدمة:`,
        ...details,
        notes ? `ملاحظات إضافية: ${notes}` : "",
        imageText
      ].filter(Boolean).join(" | ");

      const btn = document.getElementById("pay-btn");
      btn.disabled = true;
      btn.textContent = "جاري تأكيد الحجز...";

      try {
        const order = await API.createOrder({
          serviceOptionId: currentOption.id,
          locationFrom: firstValue,
          locationTo: secondValue,
          scheduledDate: date,
          scheduledTime: time,
          notes: fullNotes,
          additionalFee: null
        });

        await API.confirmOrder(order.id);

        location.href = "./order-detail.html?id=" + order.id;
      } catch (err) {
        showToast("حدث خطأ أثناء إنشاء الطلب", true);
        btn.disabled = false;
        btn.textContent = `تأكيد ودفع — ${currentOption.priceBase} ر.س`;
      }
    }
  </script>
</body>
</html>
