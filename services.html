<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — الخدمات</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="services">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>

  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>

  <script>
    async function loadServices() {
      const root = document.getElementById("page-root");
      const cats = await API.getServices();

      root.innerHTML = `
        <button class="back-btn" onclick="history.back()">← رجوع</button>

        <div class="page-header">
          <h1>الخدمات المتاحة</h1>
          <p>اختاري الخدمة المناسبة لك ثم اطلعي على التفاصيل</p>
        </div>

        <div class="grid-2 fade-in" style="max-width:860px;margin:0 auto">
          ${cats.map(c => `
            <a href="./service-detail.html?id=${c.id}" class="card-link">
              <div class="card hover" style="height:100%">
                <div class="flex items-center gap-3 mb-3">
                  <div class="card-icon">${c.icon}</div>
                  <h2 class="text-xl font-bold">${c.nameAr}</h2>
                </div>
                <p class="text-muted">${c.descriptionAr}</p>
              </div>
            </a>
          `).join("")}
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", loadServices);
  </script>
</body>
</html>
