<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — تفاصيل الحجز</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body data-page="services" data-require-auth="true">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>
  <div id="toast-container"></div>

  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>

  <script>
    let selectedPay = null;
    let selectedService = null;
    let selectedOption = null;

    function showToast(msg, isError) {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " error" : "");
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function selectPay(method) {
      selectedPay = method;

      document.querySelectorAll(".pay-method").forEach(el => {
        el.classList.remove("selected");
      });

      const btn = document.getElementById("pay-" + method);
      if (btn) btn.classList.add("selected");

      const cardFields = document.getElementById("card-fields");
      if (cardFields) {
        cardFields.style.display = method === "card" ? "block" : "none";
      }
    }

    function formatCard(value) {
      return value
        .replace(/\D/g, "")
        .slice(0, 16)
        .replace(/(.{4})/g, "$1 ")
        .trim();
    }

    function formatExpiry(value) {
      const v = value.replace(/\D/g, "").slice(0, 4);
      if (v.length >= 3) return v.slice(0, 2) + "/" + v.slice(2);
      return v;
    }

    function renderFields(option) {
      const fields = (option.fields || []).filter(f => f !== "الوقت");

      return fields.map((field, index) => {
        const isTextArea = field.includes("وصف") || field.includes("تفاصيل");

        if (isTextArea) {
          return `
            <div class="form-group">
              <label>${field} <span class="required">*</span></label>
              <textarea
                class="input booking-field"
                data-label="${field}"
                placeholder="اكتب ${field}"
                required
              ></textarea>
            </div>
          `;
        }

        return `
          <div class="form-group">
            <label>${field} <span class="required">*</span></label>
            <input
              class="input booking-field"
              data-label="${field}"
              type="text"
              placeholder="أدخل ${field}"
              required
            >
          </div>
        `;
      }).join("");
    }

    function renderImage(option) {
      if (!option.imageOptional) return "";

      return `
        <div class="form-group">
          <label>رفع صورة للمشكلة <span class="optional">(اختياري)</span></label>
          <input id="problem-image" class="input" type="file" accept="image/*">
        </div>
      `;
    }

          </div>
