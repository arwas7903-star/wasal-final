<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصال — تفاصيل الخدمة</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body data-page="services">
  <div id="layout-header"></div>

  <main class="main-content">
    <div id="page-root"></div>
  </main>

  <div id="layout-bottom-nav"></div>

  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>

  <script>
    window.addEventListener("layout-ready", async function () {
      const root = document.getElementById("page-root");
      const params = new URLSearchParams(location.search);
      const serviceId = Number(params.get("id"));

      if (!serviceId) {
        location.href = "./services.html";
        return;
      }

      const service = await API.getService(serviceId);

      if (!service) {
        root.innerHTML = `
          <div class="empty-state">
            <h2>لم يتم العثور على الخدمة</h2>
            <a href="./services.html">
              <button class="btn btn-primary mt-4">العودة للخدمات</button>
            </a>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="fade-in" style="max-width:840px;margin:0 auto">
          <button class="back-btn" onclick="history.back()">← رجوع</button>

          <div class="flex items-center gap-4 mb-4">
            <div class="card-icon" style="width:64px;height:64px;font-size:2rem">
              ${service.icon}
            </div>

            <div>
              <h1 class="text-primary">${service.nameAr}</h1>
              <p class="text-muted mt-2">${service.descriptionAr}</p>
            </div>
          </div>

          <h2 class="mb-4">خيارات الخدمة</h2>

          <div class="space-y-4">
            ${service.options.map(option => `
              <div class="option-card">
                <div class="option-body">
                  <h3>${option.nameAr}</h3>
                  <p class="text-muted mt-2">${option.descriptionAr}</p>
                </div>

                <div class="option-price-col">
                  <div>
                    <p class="text-xs text-muted mb-1">السعر الأساسي</p>
                    <p class="price-big text-primary">
                      ${option.priceBase}
                      <span class="text-muted" style="font-size:1rem;font-weight:400">ر.س</span>
                    </p>
                  </div>

                  <a href="./book.html?serviceId=${service.id}&optionId=${option.id}" style="width:100%">
                    <button class="btn btn-primary btn-full">احجز الآن</button>
                  </a>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
