<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>وصال — تفاصيل الحجز</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    .booking-container{
      max-width:700px;
      margin:40px auto;
      padding:20px;
    }

    .booking-card{
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 8px 25px rgba(0,0,0,.08);
    }

    .booking-title{
      color:#1f8f5f;
      margin-bottom:10px;
      font-size:28px;
      font-weight:bold;
    }

    .booking-sub{
      color:#666;
      margin-bottom:25px;
      line-height:1.7;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
      color:#333;
    }

    .input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:15px;
      outline:none;
    }

    textarea.input{
      min-height:120px;
      resize:none;
    }

    .submit-btn{
      width:100%;
      border:none;
      padding:15px;
      border-radius:14px;
      background:#1f8f5f;
      color:white;
      font-size:17px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    .submit-btn:hover{
      background:#166947;
    }
  </style>
</head>

<body>

<div id="layout-header"></div>

<main class="main-content">

  <div class="booking-container">

    <div class="booking-card">

      <h1 class="booking-title" id="serviceTitle">
        تفاصيل الحجز
      </h1>

      <p class="booking-sub">
        الرجاء تعبئة البيانات المطلوبة لإكمال الحجز
      </p>

      <form id="bookingForm">

        <!-- الوقت -->

        <div class="form-group">
          <label>الوقت</label>
          <input type="time" class="input" required>
        </div>

        <!-- التنقل -->

        <div id="transport-fields">

          <div class="form-group">
            <label>الموقع الحالي</label>
            <input type="text" class="input" placeholder="أدخل موقعك الحالي" required>
          </div>

          <div class="form-group">
            <label>الوجهة</label>
            <input type="text" class="input" placeholder="أدخل الوجهة المطلوبة" required>
          </div>

        </div>

        <!-- دعم الأماكن العامة -->

        <div id="public-support-fields">

          <div class="form-group">
            <label>الموقع</label>
            <input type="text" class="input" placeholder="أدخل الموقع" required>
          </div>

          <div class="form-group">
            <label>نوع المساعدة</label>
            <input type="text" class="input" placeholder="أدخل نوع المساعدة" required>
          </div>

        </div>

        <!-- دعم المنزل -->

        <div id="home-support-fields">

          <div class="form-group">
            <label>عنوان المنزل</label>
            <input type="text" class="input" placeholder="أدخل عنوان المنزل" required>
          </div>

          <div class="form-group">
            <label>نوع الدعم</label>
            <input type="text" class="input" placeholder="أدخل نوع الدعم" required>
          </div>

        </div>

        <!-- دعم المدرسة -->

        <div id="school-support-fields">

          <div class="form-group">
            <label>اسم المدرسة</label>
            <input type="text" class="input" placeholder="أدخل اسم المدرسة" required>
          </div>

          <div class="form-group">
            <label>تفاصيل المرافقة</label>
            <input type="text" class="input" placeholder="أدخل تفاصيل المرافقة" required>
          </div>

        </div>

        <!-- دعم المستشفى -->

        <div id="hospital-support-fields">

          <div class="form-group">
            <label>اسم المستشفى</label>
            <input type="text" class="input" placeholder="أدخل اسم المستشفى" required>
          </div>

          <div class="form-group">
            <label>نوع الحالة</label>
            <input type="text" class="input" placeholder="أدخل نوع الحالة" required>
          </div>

        </div>

        <!-- الدعم الشخصي -->

        <div id="support-fields">

          <div class="form-group">
            <label>نوع الطلب</label>
            <input type="text" class="input" placeholder="أدخل نوع الطلب" required>
          </div>

          <div class="form-group">
            <label>موقع التواجد</label>
            <input type="text" class="input" placeholder="أدخل موقع التواجد" required>
          </div>

        </div>

        <!-- الطلب السريع -->

        <div id="quick-fields">

          <div class="form-group">
            <label>موقع الاستلام</label>
            <input type="text" class="input" placeholder="أدخل موقع الاستلام" required>
          </div>

          <div class="form-group">
            <label>موقع التسليم</label>
            <input type="text" class="input" placeholder="أدخل موقع التسليم" required>
          </div>

        </div>

        <!-- المطعم -->

        <div id="restaurant-fields">

          <div class="form-group">
            <label>اسم المطعم</label>
            <input type="text" class="input" placeholder="أدخل اسم المطعم" required>
          </div>

          <div class="form-group">
            <label>موقع التوصيل</label>
            <input type="text" class="input" placeholder="أدخل موقع التوصيل" required>
          </div>

        </div>

        <!-- المقهى -->

        <div id="cafe-fields">

          <div class="form-group">
            <label>اسم المقهى</label>
            <input type="text" class="input" placeholder="أدخل اسم المقهى" required>
          </div>

          <div class="form-group">
            <label>عنوان التوصيل</label>
            <input type="text" class="input" placeholder="أدخل عنوان التوصيل" required>
          </div>

        </div>

        <!-- الصيانة المنزلية -->

        <div id="home-maintenance-fields">

          <div class="form-group">
            <label>نوع الخدمة</label>
            <input type="text" class="input" placeholder="أدخل نوع الخدمة" required>
          </div>

          <div class="form-group">
            <label>موقع المنزل</label>
            <input type="text" class="input" placeholder="أدخل موقع المنزل" required>
          </div>

        </div>

        <!-- صيانة الأجهزة -->

        <div id="device-maintenance-fields">

          <div class="form-group">
            <label>نوع الجهاز</label>
            <input type="text" class="input" placeholder="أدخل نوع الجهاز" required>
          </div>

          <div class="form-group">
            <label>وصف المشكلة</label>
            <textarea class="input" placeholder="اكتب وصف المشكلة" required></textarea>
          </div>

          <div class="form-group">
            <label>رفع صورة للمشكلة (اختياري)</label>
            <input type="file" class="input">
          </div>

        </div>

        <button type="submit" class="submit-btn">
          تأكيد الحجز
        </button>

      </form>

    </div>

  </div>

</main>

<div id="layout-bottom-nav"></div>

<script src="./js/config.js"></script>
<script src="./js/translations.js"></script>
<script src="./js/api.js"></script>
<script src="./js/layout.js"></script>

<script>

document.getElementById("bookingForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  alert("تم إرسال الطلب بنجاح");

  window.location.href = "./orders.html";

});

</script>

</body>
</html>
